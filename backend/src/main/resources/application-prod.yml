spring:
  application:
    name: backend

  # db configs
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
#    url: jdbc:postgresql://localhost:5432/codemind
#    username: postgres
#    password: postgres
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  #  flyway:
  #    enabled: true
  #    locations: classpath:db/migration
  #    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${OPEN_API_KEY}
      chat:
        model: gpt-4o-mini
      embedding:
        model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE


  # GitHub oauth2 related configs
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email,repo
           # redirect-uri: ${OAUTH2_REDIRECT_URI:${FRONTEND_URL}/login/oauth2/code/github}
        provider:
          github:
            user-name-attribute: id

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: none
        secure: true
      timeout: 7d


app:
  encrypt:
    password: ${ENCRYPTION_PASSWORD}
    salt: ${SALT_VALUE}
  frontend-url: ${FRONTEND_URL}
  oauth-redirect-url: ${OAUTH_REDIRECT_FRONTEND_URL:${FRONTEND_URL}}
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  indexing:
    max-file-bytes: 102400
    chunk-size: 800
    chunk-overlap: 100
  github:
    api-delay-ms: 50
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    access-expiration: 900000 # 15 minutes
    refresh-expiration: 604800000 # 7 days

